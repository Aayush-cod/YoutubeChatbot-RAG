name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: |
          pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -r backend/requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Test
        working-directory: backend
        run: python -m pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the image
        run: docker build -t yt-rag-backend ./backend

      - name: Run the container and check /health
        run: |
          docker run -d --name app -p 7860:7860 yt-rag-backend
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:7860/health; then
              exit 0
            fi
            sleep 2
          done
          echo "The server did not become healthy"
          docker logs app
          exit 1

      - name: Log in to Docker Hub
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push the image
        if: github.ref == 'refs/heads/main'
        run: |
          docker tag yt-rag-backend ${{ secrets.DOCKERHUB_USERNAME }}/yt-rag-backend:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/yt-rag-backend:latest